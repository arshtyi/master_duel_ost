[package]
name = "master-duel-ost"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
blake3 = "1.8.7"
byteorder = "1.5.0"
clap = { version = "4.6.7", features = ["derive"] }
fontdb = "0.24.0"
lewton = { version = "0.10.2", default-features = false }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-decode"] }
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std"] }
ogg = "0.9.2"
rayon = "1.12.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
